<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Hi, I'm Echo">
<style>
 .hi{font:600 22px 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#94a3b8;letter-spacing:2px}
 .name{font:900 76px 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif;letter-spacing:-3px}
