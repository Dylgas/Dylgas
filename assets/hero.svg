 .gl{font:700 18px SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace;fill:#a5b4fc;opacity:.8}
 .spin{transform-origin:960px 150px;animation:spin 30s linear infinite}
 @keyframes spin{to{transform:rotate(360deg)}}
 .wave{transform-origin:70px 64px;animation:wave 2.4s ease-in-out infinite}
 @keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(16deg)}20%,40%{transform:rotate(-8deg)}}
 .up{animation:up .9s cubic-bezier(.2,.8,.2,1) both} .up2{animation:up .9s .15s cubic-bezier(.2,.8,.2,1) both}
 @keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
</style>
